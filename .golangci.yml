version: "2"

run:
  timeout: 5m
  concurrency: 1
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
    govet:
      enable-all: true
    staticcheck:
      checks: ["all"]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: disable
    presets: []

formatters:
  enable: [gofmt]
  exclusions:
    generated: disable

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
