name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    env:
      GOWORK: "off"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: make check
      - run: make check-race
      - run: make desktop-build

  cross-platform:
    name: package-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            wails_platform: linux/amd64
            wails_extra: ""
          - platform: windows-amd64
            os: windows-2022
            wails_platform: windows/amd64
            wails_extra: "-nsis"
          - platform: macos-arm64
            os: macos-14
            wails_platform: darwin/arm64
            wails_extra: ""
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefix frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm run build:wails --prefix frontend
      - name: Run Go tests on Unix
        if: runner.os != 'Windows'
        run: go test ./...
      - name: Compile Go test packages on Windows
        if: runner.os == 'Windows'
        run: go test -run '^$' ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm run bindings:check --prefix frontend
      - run: npm run lint --prefix frontend
      - name: Build desktop package
        shell: bash
        env:
          STUDIO_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          STUDIO_WAILS_NSIS: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          STUDIO_WAILS_SKIP_FRONTEND: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: |
          npm run desktop:build --prefix frontend
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          APPIMAGETOOL_RUNTIME_FILE: ${{ runner.temp }}/runtime-x86_64
        run: |
          curl --fail --silent --show-error --location https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage --output "$APPIMAGETOOL"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $APPIMAGETOOL" | sha256sum --check
          curl --fail --silent --show-error --location https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 --output "$APPIMAGETOOL_RUNTIME_FILE"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $APPIMAGETOOL_RUNTIME_FILE" | sha256sum --check
          chmod +x "$APPIMAGETOOL"
          node scripts/desktop/build-appimage.mjs
      - name: Smoke-test desktop package
        shell: bash
        env:
          STUDIO_PACKAGE_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'darwin' || 'linux' }}
          STUDIO_REQUIRE_APPIMAGE: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: node scripts/desktop/package-smoke.mjs
      - name: Smoke-test Windows AppContainer launcher
        if: runner.os == 'Windows'
        run: node scripts/desktop/sandbox-smoke.mjs
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: liapoldus-studio-${{ matrix.platform }}
          path: build/bin/**
          if-no-files-found: error
