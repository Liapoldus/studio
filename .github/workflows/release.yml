name: release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize artifacts using repository secrets"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            wails_platform: linux/amd64
            wails_extra: ""
          - platform: windows-amd64
            os: windows-2022
            wails_platform: windows/amd64
            wails_extra: "-nsis"
          - platform: macos-arm64
            os: macos-14
            wails_platform: darwin/arm64
            wails_extra: ""
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify production plugin policy
        if: inputs.sign
        env:
          STUDIO_PLUGIN_REQUIRE_SIGNATURES: "true"
          STUDIO_PLUGIN_SANDBOX_MODE: "required"
          STUDIO_PLUGIN_TRUST_ROOTS: ${{ secrets.STUDIO_PLUGIN_TRUST_ROOTS }}
        run: npx tsx scripts/desktop/verify-release-config.mts
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefix frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm run bindings:check --prefix frontend
      - run: npm run lint --prefix frontend
      - name: Build package
        shell: bash
        env:
          STUDIO_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          STUDIO_WAILS_NSIS: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: |
          npm run desktop:build --prefix frontend
      - name: Smoke-test desktop package
        shell: bash
        env:
          STUDIO_PACKAGE_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'darwin' || 'linux' }}
        run: node scripts/desktop/package-smoke.mjs
      - name: Smoke-test Windows AppContainer launcher
        if: runner.os == 'Windows'
        run: node scripts/desktop/sandbox-smoke.mjs
      - name: Sign macOS application
        if: inputs.sign && runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/studio-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/studio-signing.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "temporary" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temporary" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "build/bin/Liapoldus Studio.app"
          ditto -c -k --keepParent "build/bin/Liapoldus Studio.app" "$RUNNER_TEMP/Liapoldus-Studio.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Liapoldus-Studio.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/bin/Liapoldus Studio.app"
      - name: Sign Windows executable
        if: inputs.sign && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_BASE64) { throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is required" }
          if (-not $env:WINDOWS_SIGNING_PASSWORD) { throw "WINDOWS_SIGNING_PASSWORD is required" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "studio-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          Get-ChildItem -Path "build/bin" -Filter *.exe -File | ForEach-Object {
            & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
          }
      - name: Create checksum
        shell: bash
        run: |
          find build/bin -type f -print0 | sort -z | xargs -0 shasum -a 256 > "build/bin/SHA256SUMS-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: liapoldus-studio-release-${{ matrix.platform }}
          path: build/bin/**
          if-no-files-found: error
